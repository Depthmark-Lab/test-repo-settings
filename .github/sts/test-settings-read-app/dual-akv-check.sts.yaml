# Trust policy for dual-akv-check on the github-sts-dev broker's
# test-settings-read-app pool: the token Depthmark-Lab/test-github-sts's
# validate-dual-akv-signing-e2e.yml gets through the broker's second Azure Key
# Vault. This pool's keys are in that vault, and test-github-sts is the source
# here and test-repo-settings the target.
#
# It lives in this repository because the pool is registered without an
# org_policy_repo, so the broker reads policies only from the target repository.
# policies/lab_data.json holds the matching bundle ceiling; keep the two
# permission lists equal.
issuer: https://token.actions.githubusercontent.com
subject: "repo:Depthmark-Lab@71595780/test-github-sts@1223040727:ref:refs/heads/main"
claim_pattern:
  job_workflow_ref: 'Depthmark-Lab/test-github-sts/\.github/workflows/validate-dual-akv-signing-e2e\.yml@refs/heads/main'
audience: github-sts
github:
  sources:
    - owner_id: "71595780"
      repository_id: "1223040727"
  target:
    owner_id: "71595780"
    repository_id: "1218555600"
permissions:
  metadata: read
