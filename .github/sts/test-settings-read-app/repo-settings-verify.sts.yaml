# Trust policy for repo-settings-verify, the harness verifier's repository reads,
# on the github-sts-dev broker's test-settings-read-app pool.
#
# It lives in this repository because the pool is registered without an
# org_policy_repo, so the broker reads policies only from the target
# repository, which here is test-repo-settings itself. policies/lab_data.json
# holds the matching bundle ceiling; keep the two permission lists equal.
#
# The dev broker requires immutable subject claims, and this repository has
# opted in to them. A job that runs in a GitHub environment gets an environment
# subject and does not match. actions_variables is left out because github-sts
# fails to load a policy that names it.
issuer: https://token.actions.githubusercontent.com
subject: "repo:Depthmark-Lab@71595780/test-repo-settings@1218555600:ref:refs/heads/main"
claim_pattern:
  job_workflow_ref: 'Depthmark-Lab/test-repo-settings/\.github/workflows/e2e-live\.yml@refs/heads/main'
audience: github-sts
github:
  sources:
    - owner_id: "71595780"
      repository_id: "1218555600"
  target:
    owner_id: "71595780"
    repository_id: "1218555600"
permissions:
  metadata: read
  contents: read
  administration: read
  actions: read
  secrets: read
  repository_hooks: read
  pages: read
