name: repo-settings

on:
  push:
    branches: [main]
    paths: ['.github/settings/**']
  pull_request:
    paths: ['.github/settings/**']

jobs:
  settings:
    uses: Depthmark/repositories-settings/.github/workflows/repo-settings-default.yml@feature/initial-release
    permissions:
      contents: read
      checks: write
      id-token: write
      pull-requests: write
    defaults:
    with:
      api-url: https://repository-settings.adelisle.com
      sts-url: https://github-sts-dev.adelisle.com
    secrets: inherit
