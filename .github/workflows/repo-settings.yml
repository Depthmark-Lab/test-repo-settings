name: repo-settings

on:
  push:
    branches: [main]
    paths: ['.github/settings/**']
  pull_request:
    paths: ['.github/settings/**']

jobs:
  settings:
    uses: Depthmark/repository-settings/.github/workflows/repo-settings-default.yml@feature/initial-release
    permissions:
      contents: read
      checks: write
      id-token: write
    secrets: inherit
