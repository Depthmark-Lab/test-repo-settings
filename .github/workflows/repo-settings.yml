name: repo-settings

on:
  push:
    branches: [main]
    paths: ['.github/settings/**']
  pull_request:
    paths: ['.github/settings/**', '.github/workflows/repo-settings.yml']

permissions: {}

jobs:
  settings:
    # Lab exception: tracks the unreleased feature branch. Pin to
    # @<full-commit-sha> # repo-settings-workflows-vX.Y.Z once released.
    uses: Depthmark/repositories-settings/.github/workflows/repo-settings.yml@feature/initial-release
    permissions:
      contents: read
      pull-requests: write
      id-token: write
