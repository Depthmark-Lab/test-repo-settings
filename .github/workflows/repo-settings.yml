name: repo-settings

on:
  push:
    branches: [main]
    paths: ['.github/settings/**']
  pull_request:
    paths: ['.github/settings/**', '.github/workflows/repo-settings.yml']

permissions: {}

jobs:
  settings:
    # Lab exception: pins the unreleased feature branch commit. Replace with a
    # released repo-settings-workflows SHA and tag once available.
    uses: Depthmark/repositories-settings/.github/workflows/repo-settings.yml@16d76e34f9760b04ebf84f8a2f6e057c13778480 # feature/initial-release
    permissions:
      contents: read
      pull-requests: write
      id-token: write
