# yaml-language-server: $schema=https://repository-settings.adelisle.com/api/schema/repo.json
_version: 1
repository:
  description: "Test repo for validating repo-settings configuration"
  homepage: "https://repository-settings.adelisle.com"
  private: true
  visibility: private
  has_issues: false
  has_projects: false
  has_wiki: true
  has_discussions: false
  is_template: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  allow_auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  merge_commit_title: PR_TITLE
  merge_commit_message: PR_BODY
  archived: false
  web_commit_signoff_required: false
topics:
  - test
  - repo-settings



